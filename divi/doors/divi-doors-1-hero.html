<script>
(function () {
  var SCEN = {
    home:    { name: 'Входная дверь в дом', text: 'Тёплая входная дверь с многозапорным замком' },
    balcony: { name: 'Балконная дверь',     text: 'Дверь на балкон или лоджию — отдельно или с окном' },
    terrace: { name: 'Раздвижной портал',   text: 'Широкий выход на террасу или в сад' },
    shop:    { name: 'Входная группа',      text: 'Дверь с боковыми и верхними светопрозрачными частями' }
  };
  var FILL = { glass: 'со стеклом', panel: 'глухая', combo: 'комбинированная' };

  var root = document.getElementById('door-calc');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';
  var state = { scen: 'home', fill: 'glass' };
  var summaryText = '';

  root.querySelectorAll('.po-dr__scen').forEach(function (b) {
    b.addEventListener('click', function () { state.scen = b.dataset.scen; render(); });
  });
  root.querySelectorAll('.po-dr__fill').forEach(function (b) {
    b.addEventListener('click', function () { state.fill = b.dataset.fill; render(); });
  });

  function render() {
    root.dataset.scen = state.scen;
    root.querySelectorAll('.po-dr__scen').forEach(function (b) {
      var on = b.dataset.scen === state.scen; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on);
    });
    root.querySelectorAll('.po-dr__fill').forEach(function (b) {
      var on = b.dataset.fill === state.fill; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on);
    });
    root.querySelector('.po-dr__caption').textContent = SCEN[state.scen].text;
    root.querySelector('.po-dr__sum').textContent = SCEN[state.scen].name + ', ' + FILL[state.fill];
    summaryText = 'Пластиковая дверь: ' + SCEN[state.scen].name + ', ' + FILL[state.fill];
  }
  render();

  var form = root.querySelector('.po-dr__form');
  var phone = form.querySelector('input[name="phone"]');
  var agree = form.querySelector('input[name="agree"]');
  var btn = form.querySelector('.po-dr__btn');
  var foot = root.querySelector('.po-dr__foot');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var digits = phone.value.replace(/\D/g, '');
    var okPhone = digits.length >= 9 && digits.length <= 15;
    phone.classList.toggle('is-error', !okPhone);
    phone.setAttribute('aria-invalid', !okPhone);
    agree.closest('label').classList.toggle('is-error', !agree.checked);
    if (!okPhone) { setFoot('Проверьте номер: нужен код оператора и 7 цифр'); phone.focus(); return; }
    if (!agree.checked) { setFoot('Отметьте согласие на обработку данных'); return; }
    var data = new FormData();
    data.append('action', 'po_calc_lead');
    data.append('phone', phone.value);
    data.append('summary', summaryText);
    data.append('page', window.location.href);
    data.append('website', form.querySelector('input[name="website"]').value);
    btn.disabled = true; btn.textContent = 'Отправляем…';
    fetch('/wp-admin/admin-ajax.php', { method: 'POST', body: data, credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.success) throw new Error();
        form.style.display = 'none';
        foot.classList.remove('is-error'); foot.classList.add('is-ok');
        foot.textContent = 'Заявка отправлена. Перезвоним в течение 15 минут в рабочее время (9:00–18:00).';
        if (typeof window.ym === 'function') { window.ym(43220839, 'reachGoal', 'calc_dveri'); }
      })
      .catch(function () {
        setFoot('Заявка не отправилась. Позвоните нам: 8 029 104-34-40');
        btn.disabled = false; btn.textContent = 'Узнать цену';
      });
  });
  function setFoot(t) { foot.textContent = t; foot.classList.add('is-error'); }
})();
</script>
