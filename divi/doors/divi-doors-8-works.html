<style>
.po-wk{--r:#D20A1E;--ink:#1C2226;--mut:#5B6268;--bg:#F3F5F9;--line:#E3E8F0;display:flex;flex-direction:column;gap:24px;font-family:inherit;color:var(--ink)}
.po-wk *{box-sizing:border-box}
.po-wk__title{margin:0!important;padding:0!important;font-size:42px!important;line-height:1.12!important;font-weight:800!important;letter-spacing:-.02em;color:var(--ink)!important}
.po-wk__lead{margin:12px 0 0!important;padding:0!important;font-size:16px;line-height:1.55;color:var(--mut)}
.po-wk__chips{display:flex;flex-wrap:wrap;gap:8px}
.po-wk__chip{min-height:44px;padding:0 18px;border:2px solid var(--line);border-radius:999px;background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.po-wk__chip:hover{border-color:#CDD4DE}
.po-wk__chip.is-active{border-color:var(--r);background:var(--r);color:#fff}
.po-wk__chip:focus-visible{outline:3px solid var(--r);outline-offset:3px}
.po-wk__count{margin:0!important;padding:0!important;font-size:14px;color:var(--mut)}
.po-wk__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.po-wk__card{margin:0;border-radius:20px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.po-wk__card[hidden]{display:none}
.po-wk__pic{display:block;position:relative;aspect-ratio:4/3;background:var(--bg);overflow:hidden}
.po-wk__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;font-size:12px;color:var(--mut)}
.po-wk__cap{display:flex;flex-direction:column;gap:2px;padding:14px 18px 16px;background:#fff}
.po-wk__cap b{font-size:16px;font-weight:800}
.po-wk__cap span{font-size:14px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.po-wk *{transition:none!important}}
@media (max-width:980px){.po-wk__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){
  .po-wk{gap:16px}
  .po-wk__title{font-size:28px!important;line-height:1.15!important}
  .po-wk__chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .po-wk__chips::-webkit-scrollbar{display:none}
  .po-wk__chip{flex:0 0 auto}
  .po-wk__grid{gap:10px}
  .po-wk__card{border-radius:14px}
  .po-wk__cap{padding:10px 12px 12px}
  .po-wk__cap b{font-size:14px}
  .po-wk__cap span{font-size:12px}
}
</style>

<script>
(function () {
  var root = document.querySelector('.po-wk');
  if (!root) return;
  var chips = root.querySelectorAll('.po-wk__chip');
  var cards = root.querySelectorAll('.po-wk__card');
  var count = root.querySelector('.po-wk__count');
  function plural(n) {
    var m = n % 10, h = n % 100;
    if (m === 1 && h !== 11) return 'работа';
    if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return 'работы';
    return 'работ';
  }
  function apply(f) {
    var n = 0;
    cards.forEach(function (c) {
      var show = f === 'all' || c.getAttribute('data-t') === f;
      c.hidden = !show;
      if (show) n++;
    });
    count.textContent = n ? 'Показано: ' + n + ' ' + plural(n) : 'В этой категории пока нет работ';
  }
  chips.forEach(function (b) {
    b.addEventListener('click', function () {
      chips.forEach(function (x) { x.classList.remove('is-active'); x.setAttribute('aria-pressed', 'false'); });
      b.classList.add('is-active'); b.setAttribute('aria-pressed', 'true');
      apply(b.getAttribute('data-f'));
    });
  });
  apply('all');
})();
</script>
